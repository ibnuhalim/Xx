name: Run bluk-cf (Cair mail + Video Debug)

on:
  workflow_dispatch:
    inputs:
      accounts:
        description: 'Jumlah akun'
        required: true
        default: '1'
        type: string
      proxy:
        description: 'Proxy (opsional, format: http://user:pass@host:port)'
        required: false
        type: string

jobs:
  run-automation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🛠️ Install System Dependencies (Chrome, Xvfb, FFmpeg)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            wget gnupg xvfb x11-utils ca-certificates jq curl \
            ffmpeg apparmor-utils

          for pkg in \
            libxkbcommon-x11-0 libnss3 \
            libatk1.0-0t64 libatk1.0-0 \
            libatk-bridge2.0-0t64 libatk-bridge2.0-0 \
            libcups2t64 libcups2 libdrm2 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libpango-1.0-0 libcairo2 \
            libasound2t64 libasound2 \
          ; do
            sudo apt-get install -y "$pkg" 2>/dev/null || echo "⚠️ skip: $pkg"
          done

          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          wget -qO- https://dl.google.com/linux/linux_signing_key.pub \
            | sudo gpg --dearmor --yes -o /usr/share/keyrings/google-linux.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-linux.gpg] https://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list

          sudo apt-get update -y
          sudo apt-get install -y google-chrome-stable

          google-chrome --version
          ffmpeg -version | head -n 1
          echo "✅ Chrome, Xvfb & FFmpeg terinstal."

      - name: 🐧 Fix AppArmor & User Namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          if [ -f /etc/apparmor.d/chrome ]; then
            sudo aa-enforce /etc/apparmor.d/chrome || true
          fi

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nodriver opencv-python-headless httpx Pillow rich
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          python -c "import nodriver; print('nodriver', nodriver.__version__)"

      - name: ⚙️ Create config.json
        env:
          PROXY_INPUT: ${{ github.event.inputs.proxy }}
        run: |
          if [ ! -f config.example.json ]; then
            echo "❌ config.example.json tidak ditemukan!"
            exit 1
          fi
          cp config.example.json config.json
          jq '.mail_api = "https://cair.eu.cc"' config.json > tmp.json && mv tmp.json config.json
          jq '.mail_domains = []' config.json > tmp.json && mv tmp.json config.json
          if [ -n "$PROXY_INPUT" ]; then
            jq --arg proxy "$PROXY_INPUT" '.proxy = $proxy' config.json > tmp.json \
              && mv tmp.json config.json
          fi
          echo "📄 config.json siap."

      # ---------------- Xvfb + FFmpeg (1366x768 laptop) ----------------
      - name: 🎥 Start Xvfb + Screen Recording (1366x768)
        run: |
          # Laptop size: 1366x768 (paling umum, file kecil)
          # Ganti ke 1920x1080 untuk PC jika perlu
          RES_W=1366
          RES_H=768

          Xvfb :99 -screen 0 ${RES_W}x${RES_H}x24 -ac +extension GLX +render -noreset \
            > /tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          echo "XVFB_PID=$XVFB_PID" >> $GITHUB_ENV
          echo "RES_W=$RES_W" >> $GITHUB_ENV
          echo "RES_H=$RES_H" >> $GITHUB_ENV

          for i in $(seq 1 15); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              echo "✅ Xvfb ready (${RES_W}x${RES_H})"
              break
            fi
            sleep 1
          done

          echo "DISPLAY=:99" >> $GITHUB_ENV

          ffmpeg -y -f x11grab \
            -video_size ${RES_W}x${RES_H} -framerate 15 -i :99 \
            -codec:v libx264 -preset ultrafast -crf 28 -pix_fmt yuv420p \
            -movflags +faststart \
            debug-recording.mp4 > /tmp/ffmpeg.log 2>&1 &
          FFMPEG_PID=$!
          echo "FFMPEG_PID=$FFMPEG_PID" >> $GITHUB_ENV

          echo "✅ Rekaman dimulai: ${RES_W}x${RES_H}, pid=$FFMPEG_PID"

      - name: 🚀 Run bluk-cf
        timeout-minutes: 30
        env:
          PROXY_URL: ${{ github.event.inputs.proxy }}
        run: |
          ACCOUNTS="${{ github.event.inputs.accounts }}"
          echo "Menjalankan $ACCOUNTS akun via Cair (display=$DISPLAY, ${RES_W}x${RES_H})..."
          if [ -n "$PROXY_URL" ]; then
            aa-exec -p chrome -- python main.py --accounts "$ACCOUNTS" --proxy "$PROXY_URL" || true
          else
            aa-exec -p chrome -- python main.py --accounts "$ACCOUNTS" || true
          fi

      - name: 🎬 Stop Recording
        if: always()
        run: |
          if [ -n "$FFMPEG_PID" ]; then
            kill -SIGINT "$FFMPEG_PID" 2>/dev/null || true
            sleep 5
            kill -SIGKILL "$FFMPEG_PID" 2>/dev/null || true
          fi
          if [ -n "$XVFB_PID" ]; then
            kill "$XVFB_PID" 2>/dev/null || true
          fi
          if [ -f debug-recording.mp4 ]; then
            SIZE=$(du -h debug-recording.mp4 | cut -f1)
            DURATION=$(ffprobe -v error -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 debug-recording.mp4 2>/dev/null || echo "?")
            echo "✅ Video: debug-recording.mp4 (${SIZE}, ${DURATION}s)"
          fi

      - name: 📤 Upload Results & Debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bluk-cf-results
          path: |
            results.json
            *.txt
            *.log
            debug/
          retention-days: 7
          if-no-files-found: warn

      - name: 🎥 Upload Debug Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-video-recording
          path: debug-recording.mp4
          retention-days: 7
          if-no-files-found: warn
