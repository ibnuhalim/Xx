name: Run bluk-cf (Cair mail)

on:
  workflow_dispatch:
    inputs:
      accounts:
        description: 'Jumlah akun'
        required: true
        default: '1'
        type: string
      proxy:
        description: 'Proxy (opsional, format: http://user:pass@host:port)'
        required: false
        type: string

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🛠️ Install System Dependencies (Chrome & Xvfb)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget gnupg xvfb libxkbcommon-x11-0 \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libasound2 libpango-1.0-0 libcairo2

          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          wget -qO- https://dl.google.com/linux/linux_signing_key.pub \
            | sudo gpg --dearmor --yes -o /usr/share/keyrings/google-linux.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-linux.gpg] https://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list

          sudo apt-get update -y
          sudo apt-get install -y google-chrome-stable
          google-chrome --version
          echo "✅ Chrome & Xvfb terinstal."

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin versi agar build stabil
          pip install nodriver==0.38.3 opencv-python-headless httpx Pillow
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: 🐛 Verify Xvfb + Chrome Launch
        run: |
          echo "=== DISPLAY test ==="
          xvfb-run --auto-servernum bash -c '
            echo "DISPLAY=$DISPLAY"
            google-chrome --version
            timeout 15 google-chrome \
              --no-sandbox --disable-dev-shm-usage --disable-gpu \
              --headless=new --dump-dom about:blank 2>&1 | head -n 5
            echo "exit=$?"
          ' || echo "⚠️ Chrome headless test failed (non-fatal)"

      - name: ⚙️ Create config.json
        env:
          PROXY_INPUT: ${{ github.event.inputs.proxy }}
        run: |
          if [ ! -f config.example.json ]; then
            echo "❌ config.example.json tidak ditemukan!"
            exit 1
          fi
          cp config.example.json config.json

          # Cair sebagai default mail API
          jq '.mail_api = "https://cair.eu.cc"' config.json > tmp.json \
            && mv tmp.json config.json
          jq '.mail_domains = []' config.json > tmp.json \
            && mv tmp.json config.json

          if [ -n "$PROXY_INPUT" ]; then
            jq --arg proxy "$PROXY_INPUT" '.proxy = $proxy' config.json > tmp.json \
              && mv tmp.json config.json
          fi

          echo "🔎 Cek Cair domains..."
          curl -s -m 15 https://cair.eu.cc/domains \
            | jq -r '."hydra:member" // .member // [] | map(select(.isActive==true)) | .[].domain' \
            | head -n 5 || true

          echo "📄 config.json siap (mail_api=cair.eu.cc)."

      - name: 🚀 Run bluk-cf
        timeout-minutes: 30
        env:
          PROXY_URL: ${{ github.event.inputs.proxy }}
          # JANGAN set DISPLAY di sini — biarkan xvfb-run yang mengatur
        run: |
          ACCOUNTS="${{ github.event.inputs.accounts }}"
          echo "Menjalankan pembuatan $ACCOUNTS akun via Cair..."

          if [ -n "$PROXY_URL" ]; then
            xvfb-run --auto-servernum \
              python main.py --accounts "$ACCOUNTS" --proxy "$PROXY_URL"
          else
            xvfb-run --auto-servernum \
              python main.py --accounts "$ACCOUNTS"
          fi

      - name: 📤 Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bluk-cf-results
          path: |
            results.json
            *.txt
            *.log
          retention-days: 7
          if-no-files-found: warn
